name: Build Web Game
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev

      - name: Setup xPack ARM Toolchain
        uses: xpack-dev-tools/arm-none-eabi-gcc-action@v2
        with:
          version: '14.2.1-1.1'

      - name: Satisfy toolchain check
        run: |
          mkdir -p .toolchain/bin
          # 建立偽裝目錄與相依 binary
          ln -sf $(which arm-none-eabi-gcc) .toolchain/bin/arm-none-eabi-gcc
          # 若腳本檢查特定子目錄或根目錄，同步建立鏈結
          GCC_PARENT=$(dirname $(dirname $(which arm-none-eabi-gcc)))
          cp -rs "$GCC_PARENT"/* .toolchain/ 2>/dev/null || true

      - name: Fetch sources & vendor
        run: |
          bash scripts/get-pokefirered.sh
          bash scripts/fetch-vendor.sh

      - name: Build ROM
        env:
          TOOLCHAIN_DIR: .toolchain
        run: |
          # 繞過腳本頂端的硬編碼檢查並執行 make
          sed -i 's/exit 1/# exit 1/g' scripts/build-rom.sh
          bash scripts/build-rom.sh

      - name: Upload Web Package
        uses: actions/upload-artifact@v4
        with:
          name: dailyred-web-game
          path: web/
